name: Terraform Apply Plan
inputs:
  environment:
    required: true
    type: string
  tf_actions_working_dir:
    required: true
    type: string
description: Terraform Validate
runs:
  using: "composite"
  steps:
    - name: Terraform Apply
      working-directory: ${{ inputs.tf_actions_working_dir }}
      shell: bash
      run: |
        ls -l
        terraform apply -auto-approve "${{ inputs.environment }}.plan.tfplan"
